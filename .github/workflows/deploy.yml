name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

jobs:
  verify:
    name: Verify CI Status on Latest Main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Query Checks API for latest main commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          LATEST_SHA=$(gh api "repos/${REPO}/commits/main" --jq '.sha')
          echo "Latest main SHA: ${LATEST_SHA}"

          CHECKS_JSON=$(gh api "repos/${REPO}/commits/${LATEST_SHA}/check-runs" --jq '.check_runs')

          FAILED_CHECKS=$(echo "$CHECKS_JSON" | jq -r '[.[] | select(.conclusion == "failure") | .name] | .[]')

          if [ -n "$FAILED_CHECKS" ]; then
            echo "::error::The following required checks failed on main (${LATEST_SHA}):"
            echo "$FAILED_CHECKS"
            exit 1
          fi

          PENDING_CHECKS=$(echo "$CHECKS_JSON" | jq -r '[.[] | select(.status != "completed") | .name] | .[]')
          if [ -n "$PENDING_CHECKS" ]; then
            echo "::warning::The following checks are still pending on main (${LATEST_SHA}):"
            echo "$PENDING_CHECKS"
            echo "Proceeding with caution..."
          fi

          echo "All completed checks passed for ${LATEST_SHA}. Deployment authorized."

  deploy:
    name: Deploy to GCP
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Must be >= the version that wrote terraform.tfstate (1.15.7).
          # Terraform refuses to read a state snapshot written by a newer version.
          terraform_version: '1.15.7'

      # Workload Identity Federation, not a service account key. GitHub mints a
      # short-lived OIDC token for this job, STS exchanges it, and IAM
      # Credentials issues an access token for the deployer. Nothing long-lived
      # is stored in the repository. The provider only accepts tokens whose
      # assertion.repository matches this repo exactly (terraform/wif.tf), so
      # these two values are configuration, not secrets, and are held as
      # repository variables.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      # State lives in GCS (terraform/backend.tf). Without a remote backend a
      # fresh runner would start empty and try to create resources that already
      # exist, which is why this job could not have worked before.
      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      # Terraform owns google_cloudfunctions2_function.scc_processor outright.
      # There is deliberately no follow-up `gcloud functions deploy` step: it
      # would redeploy the same function imperatively, outside state, dropping
      # every setting Terraform sets (secret env vars, ingress restriction,
      # memory, timeout, retry policy).
      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve -input=false
        env:
          # terraform.tfvars is gitignored, so the two variables without
          # defaults have to be supplied here or the run fails at plan time
          # with "No value for required variable".
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
